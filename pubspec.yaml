name: afric_eg_admin_panel
description: "AFRIC 2026 The Queens Edition — Admin control panel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase (same project as the app: afric-eg)
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # DI
  get_it: ^7.6.7

  # Routing
  go_router: ^14.0.0

  # Functional error handling
  dartz: ^0.10.1
  http: ^1.6.0
  cloud_functions: ^4.7.6
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  firebase_storage: ^11.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
